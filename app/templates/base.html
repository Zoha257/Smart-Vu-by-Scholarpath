<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}VU Lecture Intelligence — Admin{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --navy:#121B29; --teal:#0E8B7E; --rose:#9f1239; --bg:#F4F6F8; --line:#D8DEE7; }
  *{box-sizing:border-box}
  body{margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--navy);}
  header{background:var(--navy); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center;}
  header a{color:#fff; text-decoration:none; font-weight:600;}
  header .badge{background:var(--rose); font-size:11px; padding:3px 8px; border-radius:999px; margin-left:8px; letter-spacing:.4px;}
  main{max-width:1000px; margin:0 auto; padding:24px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:18px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line);}
  th{background:#EEF1F5;}
  .status{padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; text-transform:uppercase;}
  .status.pending{background:#eef1f5; color:#64748b;}
  .status.processing,.status.transcribing,.status.extracting_visuals,.status.generating_embeddings,.status.generating_intelligence{background:#fff4e5; color:#b45309;}
  .status.completed{background:#e6f7f4; color:#0a5c3f;}
  .status.failed{background:#fdeef1; color:#9f1239;}
  .status.reprocessed{background:#e8f0fe; color:#1c2b52;}
  form.inline{display:inline;}
  input,textarea{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-bottom:10px;}
  label{font-size:12.5px; color:#3C4A5C; font-weight:600;}
  button{background:var(--teal); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:13.5px; cursor:pointer; font-weight:600;}
  button:hover{opacity:.9}
  button.secondary{background:#3b5bdb;}
  a.btn{display:inline-block; background:var(--navy); color:#fff; padding:7px 12px; border-radius:8px; font-size:13px; text-decoration:none;}
  .warn{color:var(--rose); font-size:13px; font-weight:600;}
  .muted{color:#6B7A8D; font-size:12.5px;}
  .toggle-row{display:flex; gap:18px; margin-bottom:12px;}
  .toggle-row label{display:flex; align-items:center; gap:6px; font-weight:400; color:var(--navy); font-size:13.5px;}
  .toggle-row input[type="radio"]{width:auto; margin:0;}
  .hint{color:#6B7A8D; font-size:11.5px; margin-top:-6px; margin-bottom:12px;}
</style>
</head>
<body>
<header>
  <div><a href="/">VU Lecture Intelligence <span class="badge">ADMIN · PRIVATE</span></a></div>
  {% if request.session.get('admin_key') %}<a href="/logout" style="font-weight:400;">Logout</a>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
