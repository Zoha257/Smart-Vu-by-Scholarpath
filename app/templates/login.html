{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:380px; margin:60px auto;">
  <h2>Admin Login</h2>
  <p class="muted">This app is reachable only over a private network path (SSH tunnel / VPN / loopback) — Section 18.5. The key below is a defense-in-depth check, not the primary access control.</p>
  {% if error %}<p class="warn">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Admin Key</label>
    <input type="password" name="admin_key" required autofocus>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
